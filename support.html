<h1>支援</h1>

<h2>常見問題</h2>
<p><strong>資料存在哪裡？</strong>你的裝置與你的 iCloud 帳號，加密後儲存，開發者讀不到。詳見<a href="privacy.html">隱私權政策</a>。</p>
<p><strong>法規數字會更新嗎？</strong>會。App 啟動時會檢查更新，財政部每年 11 月公告隔年的免稅額與級距後，我們會發佈新版參數。目前版本可在 App 的「法規參數」頁查看。</p>
<p><strong>為什麼另一台裝置看不到客戶？</strong>請確認兩台裝置登入同一個 Apple ID、已開啟 iCloud 雲碟與鑰匙圈，並等待同步完成。</p>
<p><strong>試算結果可以直接用嗎？</strong>不行。結果僅供參考，規劃與申報前請諮詢會計師或律師。詳見<a href="terms.html">使用條款</a>。</p>

<h2>聯絡我們</h2>
<p>問題回報與建議：<strong>SUPPORT_EMAIL</strong></p>
